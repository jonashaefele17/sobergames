name: Supabase wach halten

# Supabase pausiert Gratis-Projekte nach 7 Tagen ohne Aktivität.
# Alle 3 Tage einmal lesen reicht, damit das Projekt bis zum Abend aktiv bleibt.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tabelle lesen
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/sobergames?select=id" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" = "200"
